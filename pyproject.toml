[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "conversion-quality-router"
version = "0.1.0"
description = "Conversion quality prediction, structured LLM decision agent, and n8n routing automation for e-commerce sessions."
requires-python = ">=3.11,<3.12"
dependencies = [
  "pandas>=2.1,<3",
  "numpy>=1.26,<2",
  "scikit-learn>=1.4,<2",
  "joblib>=1.3,<2",
  "torch>=2.2,<3",
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.27,<1",
  "pydantic>=2.6,<3",
  "httpx>=0.27,<1",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
  "ruff>=0.4,<1",
  "matplotlib>=3.8,<4",
  "nbconvert>=7.16,<8",
  "ipykernel>=6.29,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Known, investigated warning (not suppressed -- left visible on purpose):
# "Using `httpx` with `starlette.testclient` is deprecated; install `httpx2`
# instead." Root cause: starlette/testclient.py itself (third-party code,
# not this project's), migrating its TestClient to a separate `httpx2`
# package. `httpx2` is real and installable but is dev/test-only tooling,
# not a functional requirement of this project (our own httpx usage in
# src/conversion_router/agent/client.py is unaffected and current).
# Not added as a dependency solely to silence a test-runner-only warning;
# not globally suppressed via filterwarnings either, so it stays visible if
# starlette's plans change. Revisit if starlette drops httpx support outright.
